[project]
name = "temporalio-localserver"
version = "0.1.0"
description = "The local-server module that temporalio's LocalExecution runs in-process"
requires-python = ">=3.10"
license = "MIT"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/temporalio_localserver"]
artifacts = ["src/temporalio_localserver/local-server.wasm"]
