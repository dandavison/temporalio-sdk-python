syntax = "proto3";

// The requests and responses of the crate's entry point, `Streams::call`. An SDK sends each as
// bytes, with the name of the call. Prototype. sdk-python has a copy of this file, which must stay
// identical.
package temporal.sdk.streams.v1;

import "google/protobuf/duration.proto";
import "temporal/api/protocol/v1/message.proto";
import "temporal/api/nexusservices/streamservice/v1/request_response.proto";

// A stream, named by its owner: a workflow run chain, by workflow_id and first_run_id, or a
// Standalone Activity execution, by activity_id and activity_run_id. Exactly one of workflow_id and
// activity_id is set. On Redis, appends and closes need the owner's run ID; a read without it reads
// the stream of the owner ID's run that most recently created one.
message StreamRef {
    string workflow_id = 1;
    string first_run_id = 2;
    string activity_id = 3;
    string activity_run_id = 4;
}

message ClientProducer {
    string id = 1;
    int64 epoch = 2;
}

// An activity attempt. Its epoch is the stamp its attempt started with. Native uses only
// task_token, from which the server derives the rest; Redis uses only the other fields, as given.
message ActivityProducer {
    bytes task_token = 1;
    // Empty for a standalone activity.
    string workflow_run_id = 2;
    string activity_id = 3;
    // Set only for a standalone activity.
    string activity_run_id = 4;
    int32 attempt_stamp = 5;
}

// A workflow task attempt of a run.
message WorkflowProducer {
    string run_id = 1;
    // The workflow task's identity: the started event ID of the run's last completed workflow task.
    int64 previous_started_event_id = 2;
    int32 attempt = 3;
}

// A local activity attempt, and the workflow task it was scheduled in.
message LocalActivityProducer {
    string run_id = 1;
    int64 previous_started_event_id = 2;
    int32 workflow_task_attempt = 3;
    string activity_id = 4;
    int32 attempt = 5;
}

message Producer {
    oneof variant {
        ClientProducer client = 1;
        ActivityProducer activity = 2;
        WorkflowProducer workflow = 3;
        LocalActivityProducer local_activity = 4;
    }
}

// "Append". Appends the records as one atomic, contiguous batch.
message AppendRequest {
    StreamRef stream = 1;
    Producer producer = 2;
    // 0 for the producer's first append in an epoch, then one more than its latest.
    int64 seq = 3;
    repeated temporal.api.nexusservices.streamservice.v1.AppendRecord records = 4;
    bool finish = 5;
}

message AppendResponse {
    repeated bytes cursors = 1;
}

// "Close". Only the stream's owner closes the stream: a workflow task of the owning run (owner), or
// an attempt of the owning Standalone Activity (activity_owner). Exactly one is set. On Redis
// nothing else closes an activity's stream when the activity ends.
message CloseRequest {
    StreamRef stream = 1;
    WorkflowProducer owner = 2;
    // The owner's next seq in its epoch: a close is an append of no records.
    int64 seq = 3;
    temporal.api.nexusservices.streamservice.v1.StreamClose close = 4;
    ActivityProducer activity_owner = 5;
}

message CloseResponse {
}

// "Read". The response is a temporal.api.nexusservices.streamservice.v1.ReadResponse.
message ReadRequest {
    StreamRef stream = 1;
    // Empty means from the beginning.
    bytes after = 2;
    repeated string topics = 3;
    int32 max_records = 4;
    // Native caps it at 20 s; Redis does not cap it.
    google.protobuf.Duration wait = 5;
    int32 last = 6;
    // gRPC metadata and deadline for each call that native makes for this read. A key ending in
    // "-bin" is binary metadata; other values must be ASCII. Redis ignores both.
    map<string, bytes> rpc_metadata = 7;
    google.protobuf.Duration rpc_timeout = 8;
}

// "WorkflowActivationCompleted". Sent by the worker after a successful activation, before the
// activation's completion is sent. Appends the activation's records, splitting them into appends
// that fit the size limits; in commit mode, returns them instead. If an append fails, the earlier
// appends of the activation stay stored. Then writes close, if set.
message WorkflowActivationCompletedRequest {
    string workflow_id = 1;
    string run_id = 2;
    string first_run_id = 3;
    // The workflow task of the activation.
    int64 previous_started_event_id = 4;
    int32 attempt = 5;
    repeated temporal.api.nexusservices.streamservice.v1.AppendRecord records = 6;
    // Set when the completion ends the run.
    WorkflowEnding ending = 7;
    // The run's workflow declares commit mode. Only native supports it; other backends fail the
    // call. The server fixes a run's mode at its first workflow append, so a run whose workers
    // disagree fails the workflow tasks of the workers in the other mode.
    bool commit_mode = 8;
    // The workflow closed its own stream in this activation. The crate closes the stream after
    // appending the records, as the activation's workflow task, and then writes no close when the
    // run ends. Not supported in commit mode: the close would precede the records, which travel in
    // the task completion. The close is written before the task completes, so if the task attempt
    // then fails, its retry's appends and close fail as CLOSED, and the run's workflow tasks keep
    // failing.
    temporal.api.nexusservices.streamservice.v1.StreamClose close = 9;
}

// How a run ends, from the terminal command of its completion.
message WorkflowEnding {
    temporal.api.nexusservices.streamservice.v1.StreamClose close = 1;
    // The workflow has a cron schedule, so a completed run is followed by another.
    bool cron = 2;
    // The workflow has a retry policy, so a failed run may be retried.
    bool retry_policy = 3;
}

message WorkflowActivationCompletedResponse {
    // In commit mode, the records as protocol messages, which the worker sends in the activation's
    // completion. The server appends them in the workflow task completion's transaction.
    repeated temporal.api.protocol.v1.Message protocol_messages = 1;
}

// "WorkflowEvicted". Sent by the worker when a run is evicted. execution_ending is set when the
// eviction's reason is WORKFLOW_EXECUTION_ENDING, which Core sends only after the server accepted
// the run's terminal completion.
message WorkflowEvictedRequest {
    string run_id = 1;
    bool execution_ending = 2;
}

message WorkflowEvictedResponse {
}

message RedisOptions {
    string url = 1;
    // Part of every key, so that namespaces sharing a Redis do not share streams. Not checked
    // against the Temporal namespace.
    string namespace = 2;
    // How long a stream's data is kept after its last write; reads do not extend it. Required.
    google.protobuf.Duration retention = 3;
}

message NativeOptions {
    string namespace = 1;
    reserved 2;
}
